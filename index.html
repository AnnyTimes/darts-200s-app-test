<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DARTS PRACTICE 200S TEST</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#070b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation}
body{min-height:100vh} button{font:inherit;touch-action:manipulation}
.app{width:min(100%,760px);margin:0 auto;padding:18px 16px 32px}
.title{text-align:center;font-size:24px;font-weight:800;letter-spacing:.12em;margin:8px 0 20px}
.card{background:#101820;border:1px solid #263441;border-radius:16px;padding:16px;margin-bottom:14px}
.card-title{font-size:14px;color:#9eabb6;margin-bottom:10px}
.hidden{display:none!important}
.connection-status{display:flex;align-items:center;gap:10px;min-height:38px}
.connection-dot{width:14px;height:14px;border-radius:50%;background:#69747d;flex:none}
.connection-status.ok .connection-dot{background:#24d26d;box-shadow:0 0 12px rgba(36,210,109,.55)}
.connection-text{font-size:24px;font-weight:800}
.connection-status.ok .connection-text{color:#24d26d}
.connection-note{color:#8d9aa5;font-size:12px;margin-top:7px}
.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-button{height:52px;border-radius:12px;border:1px solid #334451;background:#0b1218;color:#aeb9c2;font-weight:800}
.mode-button.active{border-color:#3c87bd;background:#122c3e;color:#fff}
.setting-row{border-top:1px solid #26333d;padding:13px 0}
.setting-row:first-child{border-top:0}
.setting-label{color:#b6c1c9;margin-bottom:9px;font-size:14px}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.stepper button,.target-buttons button{min-height:44px;border-radius:9px;border:1px solid #354653;background:#0b1218;color:#fff;font-weight:800}
.stepper .current{background:#172735;border-color:#4b718f;font-size:16px}
.target-buttons{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.target-buttons button.active{background:#122c3e;border-color:#3c87bd}
.start-button{width:100%;height:56px;margin-top:14px;border:0;border-radius:12px;background:#c52e3b;color:#fff;font-weight:800;font-size:17px}
.play-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.play-mode{font-size:13px;color:#9daab4}
.target-label{font-size:20px;font-weight:800;text-align:center;margin-bottom:12px}
.score-area{position:relative;min-height:260px;display:grid;grid-template-columns:92px 1fr 92px;align-items:center;gap:8px}
.history{align-self:stretch;max-height:260px;overflow:auto;padding-right:4px}
.history-title{color:#87949e;font-size:11px;margin-bottom:6px}
.history-item{font-size:14px;line-height:1.5;border-bottom:1px solid #202c34;padding:5px 0}
.history-item .positive{color:#42a7e8} .history-item .negative{color:#e14a57} .history-item .zero{color:#9da7ae}
.score{text-align:center} .score-number{font-size:82px;line-height:1;font-weight:900;letter-spacing:-.05em}
.score-goal{color:#8996a0;font-size:13px;margin-top:8px}
.out-area{display:flex;justify-content:center}
.out-button{width:82px;min-height:82px;border-radius:12px;border:2px solid #bd3442;background:#170d10;color:#ef5a65;font-weight:900;font-size:18px}
.play-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.action-button{min-height:48px;border-radius:11px;border:1px solid #35444f;background:#101a22;color:#fff;font-weight:700}
.action-button.undo{border-color:#4a6680} .action-button.reset{border-color:#663b40}
.last-input{margin-top:12px;color:#8c99a3;font-size:12px;text-align:center;min-height:18px}
.finished{text-align:center;padding:24px 10px 12px} .finished-title{font-size:30px;font-weight:900;margin-bottom:8px}
.finished-score{color:#42a7e8;font-size:18px} .back-button{width:100%;height:52px;margin-top:18px;border-radius:11px;border:1px solid #40515e;background:#101a22;color:#fff;font-weight:800}
@media(max-width:520px){
.app{padding:14px 12px 26px} .score-area{grid-template-columns:70px 1fr 82px;min-height:240px}
.score-number{font-size:68px} .out-button{width:72px;min-height:72px} .history{max-height:230px} .history-item{font-size:12px}
.target-buttons{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="app">
<div class="title">DARTS PRACTICE</div>

<section id="settingsScreen">
  <div class="card">
    <div class="card-title">ダーツボード接続確認</div>
    <div id="connectionStatus" class="connection-status"><span class="connection-dot"></span><span id="connectionText" class="connection-text">未確認</span></div>
    <div id="connectionNote" class="connection-note">ダーツボードにスローして下さい</div>
  </div>

  <div class="card">
    <div class="card-title">モード</div>
    <div class="mode-buttons">
      <button id="bullModeButton" class="mode-button active" type="button">BULL</button>
      <button id="cricketModeButton" class="mode-button" type="button">CRICKET</button>
    </div>

    <div id="bullSettings">
      <div class="setting-row">
        <div class="setting-label">GOAL</div>
        <div class="stepper" data-setting="bullGoal">
          <button type="button" data-delta="-10">−10</button><button type="button" data-delta="-1">−1</button>
          <button type="button" class="current" data-value-display="bullGoal">50</button>
          <button type="button" data-delta="1">+1</button><button type="button" data-delta="10">+10</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">IN BULL</div>
        <div class="stepper" data-setting="bullInner">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="bullInner">+1</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">OUT BULL</div>
        <div class="stepper" data-setting="bullOuter">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="bullOuter">0</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">その他</div>
        <div class="stepper" data-setting="bullOther">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="bullOther">−1</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
    </div>

    <div id="cricketSettings" class="hidden">
      <div class="setting-row">
        <div class="setting-label">GOAL</div>
        <div class="stepper" data-setting="cricketGoal">
          <button type="button" data-delta="-10">−10</button><button type="button" data-delta="-1">−1</button>
          <button type="button" class="current" data-value-display="cricketGoal">30</button>
          <button type="button" data-delta="1">+1</button><button type="button" data-delta="10">+10</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">ターゲット</div>
        <div id="targetButtons" class="target-buttons">
          <button type="button" data-target="20" class="active">20</button><button type="button" data-target="19">19</button>
          <button type="button" data-target="18">18</button><button type="button" data-target="17">17</button>
          <button type="button" data-target="16">16</button><button type="button" data-target="15">15</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Single</div>
        <div class="stepper" data-setting="cricketSingle">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="cricketSingle">+1</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Double</div>
        <div class="stepper" data-setting="cricketDouble">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="cricketDouble">+2</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">Triple</div>
        <div class="stepper" data-setting="cricketTriple">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="cricketTriple">+3</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-label">その他</div>
        <div class="stepper" data-setting="cricketOther">
          <button type="button" data-delta="-1">−1</button><button type="button" class="current" data-value-display="cricketOther">−1</button><button type="button" data-delta="1">+1</button>
        </div>
      </div>
    </div>

    <button id="startButton" class="start-button" type="button">決定してスタート</button>
  </div>
</section>

<section id="playScreen" class="hidden">
  <div class="card">
    <div class="play-header"><span id="playMode" class="play-mode"></span><button id="backSettingsButton" class="action-button" type="button">設定</button></div>
    <div id="playTarget" class="target-label"></div>
    <div class="score-area">
      <div class="history"><div class="history-title">HISTORY</div><div id="historyList"></div></div>
      <div class="score"><div id="scoreNumber" class="score-number">0</div><div id="scoreGoal" class="score-goal"></div></div>
      <div class="out-area"><button id="outButton" class="out-button" type="button">OUT</button></div>
    </div>
    <div class="play-actions"><button id="undoButton" class="action-button undo" type="button">戻す</button><button id="resetButton" class="action-button reset" type="button">RESET</button></div>
    <div id="lastInput" class="last-input"></div>
  </div>
  <div id="finishedCard" class="card hidden"><div class="finished"><div class="finished-title">GOAL!</div><div id="finishedScore" class="finished-score"></div><button id="finishBackButton" class="back-button" type="button">設定に戻る</button></div></div>
</section>
</div>

<audio id="seWadaiko" src="se_wadaiko.mp3" preload="auto"></audio>
<audio id="seImpact" src="se_impact.mp3" preload="auto"></audio>
<audio id="seArrow" src="se_arrow.mp3" preload="auto"></audio>
<audio id="seKotsuzumi" src="se_kotsuzumi.mp3" preload="auto"></audio>

<script>
(() => {
"use strict";

const CODE_MAPPING = {
  "KeyS": ["1","outer"],
  "KeyI": ["1","inner"],
  "ShiftLeft+KeyW": ["1","double"],
  "KeyN": ["1","triple"],
  "Digit9": ["2","outer"],
  "Equal": ["2","inner"],
  "ShiftLeft+Digit1": ["2","double"],
  "ShiftLeft+Semicolon": ["2","triple"],
  "KeyM": ["3","outer"],
  "ShiftLeft+Digit4": ["3","inner"],
  "ShiftLeft+KeyO": ["3","double"],
  "ShiftLeft+KeyJ": ["3","triple"],
  "ShiftLeft+KeyF": ["4","outer"],
  "Digit3": ["4","inner"],
  "ShiftLeft+Digit2": ["4","double"],
  "Minus": ["4","triple"],
  "Digit7": ["5","outer"],
  "Digit0": ["5","inner"],
  "ShiftLeft+KeyK": ["5","double"],
  "ShiftLeft+Equal": ["5","triple"],
  "KeyA": ["6","outer"],
  "BracketRight": ["6","inner"],
  "Backslash": ["6","double"],
  "KeyK": ["6","triple"],
  "Quote": ["7","outer"],
  "KeyO": ["7","inner"],
  "ShiftLeft+KeyI": ["7","double"],
  "ShiftLeft+KeyS": ["7","triple"],
  "ShiftLeft+KeyN": ["8","outer"],
  "ShiftLeft+Digit7": ["8","inner"],
  "ShiftLeft+KeyZ": ["8","double"],
  "Semicolon": ["8","triple"],
  "ShiftLeft+KeyA": ["9","outer"],
  "Digit5": ["9","inner"],
  "ShiftLeft+KeyD": ["9","double"],
  "ShiftLeft+Digit9": ["9","triple"],
  "ShiftLeft+Digit6": ["10","outer"],
  "ShiftLeft+Minus": ["10","inner"],
  "Digit6": ["10","double"],
  "Digit1": ["10","triple"],
  "ShiftLeft+KeyM": ["11","outer"],
  "KeyH": ["11","inner"],
  "Digit2": ["11","double"],
  "KeyB": ["11","triple"],
  "KeyF": ["12","outer"],
  "ShiftLeft+KeyP": ["12","inner"],
  "ShiftLeft+Period": ["12","double"],
  "ShiftLeft+Slash": ["12","triple"],
  "KeyL": ["13","outer"],
  "ShiftLeft+KeyQ": ["13","inner"],
  "KeyQ": ["13","double"],
  "KeyC": ["13","triple"],
  "Slash": ["14","outer"],
  "ShiftLeft+KeyB": ["14","inner"],
  "KeyP": ["14","double"],
  "KeyT": ["14","triple"],
  "ShiftLeft+KeyY": ["15","outer"],
  "KeyJ": ["15","inner"],
  "ShiftLeft+KeyT": ["15","double"],
  "ShiftLeft+KeyH": ["15","triple"],
  "Comma": ["16","outer"],
  "ShiftLeft+KeyE": ["16","inner"],
  "KeyE": ["16","double"],
  "ShiftLeft+KeyX": ["16","triple"],
  "ShiftLeft+KeyG": ["17","outer"],
  "ShiftLeft+Digit5": ["17","inner"],
  "ShiftLeft+KeyR": ["17","double"],
  "KeyD": ["17","triple"],
  "ShiftLeft+KeyL": ["18","outer"],
  "ShiftLeft+KeyC": ["18","inner"],
  "ShiftLeft+Digit3": ["18","double"],
  "ShiftLeft+KeyU": ["18","triple"],
  "KeyR": ["19","outer"],
  "Digit8": ["19","inner"],
  "Period": ["19","double"],
  "ShiftLeft+KeyV": ["19","triple"],
  "ShiftLeft+Digit8": ["20","outer"],
  "Digit4": ["20","inner"],
  "ShiftLeft+Comma": ["20","double"],
  "BracketLeft": ["20","triple"],
  "ShiftLeft+Quote": ["bull","outer"],
  "KeyG": ["bull","inner"]
};

const settings = {
  bullGoal: 50, bullInner: 1, bullOuter: 0, bullOther: -1,
  cricketGoal: 30, cricketTarget: "20",
  cricketSingle: 1, cricketDouble: 2, cricketTriple: 3, cricketOther: -1
};

let mode = "BULL", goal = 50, cricketTarget = "20", score = 0, history = [];
let inputBuffer = [], inputTimer = null, seUnlocked = false, finished = false;
const GROUP_WINDOW = 200;

const $ = id => document.getElementById(id);
const settingsScreen = $("settingsScreen"), playScreen = $("playScreen");
const connectionStatus = $("connectionStatus"), connectionText = $("connectionText"), connectionNote = $("connectionNote");
const bullModeButton = $("bullModeButton"), cricketModeButton = $("cricketModeButton");
const bullSettings = $("bullSettings"), cricketSettings = $("cricketSettings");
const targetButtons = document.querySelectorAll("#targetButtons button");
const startButton = $("startButton"), playMode = $("playMode"), playTarget = $("playTarget");
const scoreNumber = $("scoreNumber"), scoreGoal = $("scoreGoal"), historyList = $("historyList");
const outButton = $("outButton"), undoButton = $("undoButton"), resetButton = $("resetButton");
const backSettingsButton = $("backSettingsButton"), lastInput = $("lastInput");
const finishedCard = $("finishedCard"), finishedScore = $("finishedScore"), finishBackButton = $("finishBackButton");

function formatValue(v) { return v > 0 ? "+" + v : String(v); }
function clamp(v, min=-999, max=9999) { return Math.max(min, Math.min(max, Math.trunc(v))); }

function updateSettingUI() {
  document.querySelectorAll("[data-value-display]").forEach(el => {
    const key = el.dataset.valueDisplay;
    el.textContent = formatValue(settings[key]);
  });
  targetButtons.forEach(b => b.classList.toggle("active", b.dataset.target === settings.cricketTarget));
}

document.querySelectorAll(".stepper").forEach(stepper => {
  stepper.addEventListener("click", e => {
    const button = e.target.closest("button");
    if (!button || button.dataset.delta === undefined) return;
    const key = stepper.dataset.setting;
    settings[key] = clamp(settings[key] + Number(button.dataset.delta));
    updateSettingUI();
  });
});

targetButtons.forEach(button => {
  button.addEventListener("click", () => {
    settings.cricketTarget = button.dataset.target;
    updateSettingUI();
  });
});

function setMode(next) {
  mode = next;
  const bull = mode === "BULL";
  bullModeButton.classList.toggle("active", bull);
  cricketModeButton.classList.toggle("active", !bull);
  bullSettings.classList.toggle("hidden", !bull);
  cricketSettings.classList.toggle("hidden", bull);
}
bullModeButton.addEventListener("click", () => setMode("BULL"));
cricketModeButton.addEventListener("click", () => setMode("CRICKET"));

function markConnectionOK() {
  connectionStatus.classList.add("ok");
  connectionText.textContent = "接続OK!";
  connectionNote.textContent = "200SからHID入力を確認しました";
}

function resolveByCode(events) {
  const codes = events.map(e => e.code);
  if (codes.length === 2) {
    const shift = codes.find(c => c === "ShiftLeft" || c === "ShiftRight");
    const other = codes.find(c => c !== "ShiftLeft" && c !== "ShiftRight");
    if (shift && other) return CODE_MAPPING["ShiftLeft+" + other] || null;
  }
  if (codes.length === 1) return CODE_MAPPING[codes[0]] || null;
  return null;
}

function getScoreValue(target, area) {
  if (mode === "BULL") {
    if (target === "bull" && area === "inner") return settings.bullInner;
    if (target === "bull" && area === "outer") return settings.bullOuter;
    return settings.bullOther;
  }
  if (target === cricketTarget) {
    if (area === "outer" || area === "inner") return settings.cricketSingle;
    if (area === "double") return settings.cricketDouble;
    if (area === "triple") return settings.cricketTriple;
  }
  return settings.cricketOther;
}

function areaLabel(area) {
  return {outer:"外S", inner:"内S", double:"D", triple:"T"}[area] || area;
}
function targetLabel(target) { return target === "bull" ? "BULL" : target; }

function addResult(target, area, value, source) {
  const before = score;
  score += value;
  history.push({target, area, value, before, after: score, source});
  render();
  if (score >= goal) finishGame();
}

function unlockAudio() {
  const audios = [$("seWadaiko"), $("seImpact"), $("seArrow"), $("seKotsuzumi")];
  audios.forEach(a => {
    try {
      a.muted = true;
      const p = a.play();
      if (p) p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
      else a.muted = false;
    } catch (_) { a.muted = false; }
  });
  seUnlocked = true;
}

function playOne(id) {
  const base = $(id);
  if (!base) return Promise.resolve();
  const audio = base.cloneNode(true);
  audio.volume = 1;
  audio.currentTime = 0;
  const p = audio.play();
  if (p && typeof p.catch === "function") p.catch(() => {});
  setTimeout(() => audio.remove(), 1500);
  return p && typeof p.then === "function" ? p : Promise.resolve();
}

function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function playSE(target, area) {
  if (!seUnlocked) return;
  if (mode === "BULL") {
    if (target === "bull" && area === "inner") return playOne("seImpact");
    if (target === "bull" && area === "outer") return playOne("seKotsuzumi");
    return playOne("seArrow");
  }
  if (target === cricketTarget && (area === "outer" || area === "inner")) {
    return playOne("seWadaiko");
  }
  if (target === cricketTarget && (area === "double" || area === "triple")) {
    const count = area === "double" ? 2 : 3;
    for (let i = 0; i < count; i++) {
      await playOne("seWadaiko");
      if (i < count - 1) await delay(110);
    }
    return;
  }
  return playOne("seArrow");
}

function receiveHID(event) {
  if (event.repeat) return;
  markConnectionOK();
  inputBuffer.push({key:event.key, code:event.code, keyCode:event.keyCode, time:performance.now()});
  clearTimeout(inputTimer);
  inputTimer = setTimeout(processBufferedInput, GROUP_WINDOW);
}

function processBufferedInput() {
  inputTimer = null;
  if (!inputBuffer.length) return;
  const events = inputBuffer.slice();
  inputBuffer = [];
  const mapped = resolveByCode(events);
  if (!mapped) {
    lastInput.textContent = "HID受信: " + events.map(e => e.key).join(" + ") + "（未登録）";
    return;
  }
  const [target, area] = mapped;
  const value = getScoreValue(target, area);
  addResult(target, area, value, "HID");
  lastInput.textContent = "HID: " + targetLabel(target) + " " + areaLabel(area) + "  " + formatValue(value);
  void playSE(target, area);
}

outButton.addEventListener("click", () => {
  addResult("OUT", "other", mode === "BULL" ? settings.bullOther : settings.cricketOther, "OUT");
  lastInput.textContent = "OUT  " + formatValue(mode === "BULL" ? settings.bullOther : settings.cricketOther);
  void playOne("seArrow");
});

undoButton.addEventListener("click", () => {
  if (!history.length) return;
  const item = history.pop();
  score = item.before;
  finished = false;
  finishedCard.classList.add("hidden");
  render();
  lastInput.textContent = "戻しました";
});

resetButton.addEventListener("click", () => {
  score = 0; history = []; finished = false;
  finishedCard.classList.add("hidden");
  lastInput.textContent = "RESET";
  render();
});

function render() {
  scoreNumber.textContent = score;
  scoreGoal.textContent = "GOAL " + goal;
  historyList.innerHTML = "";
  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    const label = item.source === "OUT" ? "OUT" : targetLabel(item.target) + " " + areaLabel(item.area);
    const valueText = formatValue(item.value);
    const cls = item.value > 0 ? "positive" : item.value < 0 ? "negative" : "zero";
    div.innerHTML = label + ' <span class="' + cls + '">' + valueText + "</span>";
    historyList.appendChild(div);
  });
}

function finishGame() {
  finished = true;
  finishedCard.classList.remove("hidden");
  finishedScore.textContent = "SCORE " + score + " / GOAL " + goal;
}

startButton.addEventListener("click", () => {
  unlockAudio();
  goal = mode === "BULL" ? settings.bullGoal : settings.cricketGoal;
  cricketTarget = settings.cricketTarget;
  score = 0; history = []; finished = false; lastInput.textContent = "";
  settingsScreen.classList.add("hidden");
  playScreen.classList.remove("hidden");
  finishedCard.classList.add("hidden");
  playMode.textContent = mode;
  playTarget.textContent = mode === "BULL" ? "BULL" : "TARGET " + cricketTarget;
  render();
});

function returnToSettings() {
  playScreen.classList.add("hidden");
  settingsScreen.classList.remove("hidden");
  finishedCard.classList.add("hidden");
}
backSettingsButton.addEventListener("click", returnToSettings);
finishBackButton.addEventListener("click", returnToSettings);

document.addEventListener("keydown", receiveHID, false);
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());

setMode("BULL");
updateSettingUI();
render();
})();
</script>
</body>
</html>
